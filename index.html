<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Offline Conversions</title>

  <!-- Consent Mode v2 (MUST be before GTM) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('consent', 'default', {
      ad_storage: 'denied',
      analytics_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
  </script>

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MKPKSGR6');
  </script>
  <!-- End GTM -->

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- GTM noscript -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MKPKSGR6"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <div class="container">
    <h1>Test Offline Conversions</h1>

    <form id="leadForm" class="form">
      <input type="email" id="email" placeholder="Email address" required />
      <input type="tel" id="phone" placeholder="Phone number" required />
      <button type="submit" class="btn">Submit</button>
    </form>
  </div>

  <script>
    /* Capture GCLID */
    const params = new URLSearchParams(window.location.search);
    const gclid = params.get('gclid');
    if (gclid) localStorage.setItem('gclid', gclid);

    async function sha256(value) {
      const enc = new TextEncoder().encode(value.trim().toLowerCase());
      const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    document.getElementById('leadForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const gclidStored = localStorage.getItem('gclid');

      console.log('Email:', email);
      console.log('Phone:', phone);
      console.log('GCLID:', gclidStored);

      const emailHash = await sha256(email);
      const phoneHash = await sha256(phone.replace(/\D/g, ''));

      /* Grant consent */
      gtag('consent', 'update', {
        ad_storage: 'granted',
        analytics_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted'
      });

      /* Push data to GTM */
      dataLayer.push({
        event: 'generate_lead',
        email_hash: emailHash,
        phone_hash: phoneHash,
        gclid: gclidStored
      });

      /* Send to Google Sheets */
      fetch('https://script.google.com/macros/s/AKfycbxbJHusuMinJIc1pKJIxJju5C2wIsRjoFTyZaQ8P64i8E-S_J_TESU_hJIEG8GAXcs7Ug/exec', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          email: email,
          phone: phone,
          gclid: gclidStored,
          timestamp: new Date().toISOString()
        })
      })
      .then(res => res.text())
      .then(text => console.log('Sheets response:', text))
      .catch(err => console.error('Sheets error:', err));

      /* Store hashes for thank you page */
      localStorage.setItem('email_hash', emailHash);
      localStorage.setItem('phone_hash', phoneHash);

      window.location.href = 'thankyou.html';
    });
  </script>
</body>
</html>
